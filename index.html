<!DOCTYPE html>
<html>
<head>
  <title>LocalConnect Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <h2>LocalConnect Pro</h2>
  <button id="logoutBtn" class="btn danger hidden" onclick="logout()">Logout</button>
</header>

<!-- AUTH -->
<div id="authSection" class="auth-box">
  <h3 id="authTitle">Login</h3>

  <input type="text" id="name" class="hidden" placeholder="Full Name">
  <input type="text" id="phone" class="hidden" placeholder="Phone Number">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <select id="role" class="hidden">
    <option value="user">User</option>
    <option value="provider">Provider</option>
  </select>

  <button id="authBtn" class="btn primary" onclick="handleAuth()">Login</button>
  <p class="link" onclick="toggleAuth()">Create Account</p>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="container hidden"></div>

<script src="script.js"></script>
</body>
</html>
